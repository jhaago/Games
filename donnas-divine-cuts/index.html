<body>
<div id="app">
<header><div class="brand"><div class="brand-mark" data-icon="scissors"></div><div><div class="brand-name">Donna’s Divine Cuts</div><div class="brand-sub">A little colour. A little magic.</div></div></div><div class="spacer"></div><button class="score" id="rewardsButton" title="Stars and unlocks"><span aria-hidden="true">★</span> <span id="starCount">0</span> <span class="header-label">stars</span></button><button id="albumButton" class="header-album" title="Photo album"><span data-icon="album"></span> <span class="header-label">Album</span></button><button id="homeButton" class="icon-button" title="Salon menu" aria-label="Salon menu" data-icon="home"></button><button id="fullscreenButton" class="icon-button fullscreen-small" title="Full screen" aria-label="Full screen" aria-pressed="false" data-icon="expand"></button><button id="helpButton" class="icon-button" title="Help" aria-label="How to play" data-icon="help"></button></header>

   h.len=(135+35*u)+434-(245+14*u);h.curl=id==='swept'?.22:0;

   }

function transform(){viewScale=Math.min(vw/600,vh/710);viewX=(vw-600*viewScale)/2;viewY=(vh-710*viewScale)/2;if(stage==='makeup'){viewScale=Math.min(vw/265,vh/440);viewX=vw/2-300*viewScale;viewY=vh*.38-260*viewScale;}if(stage==='nails'){viewScale=Math.min(vw/380,vh/380);viewX=vw/2-260*viewScale;viewY=vh/2-250*viewScale;}}

function makeGoals(){const availableColours=palette.filter(c=>!c[2]&&c[0]!=='Snow'&&c[0]!=='Midnight');const cc=availableColours[Math.floor(Math.random()*availableColours.length)];const availableOutfits=outfits.filter(o=>unlocked(o.unlock));const o=availableOutfits[Math.floor(Math.random()*availableOutfits.length)];const variants=[{type:'hairColor',target:cc[1],label:`Colour some hair ${cc[0].toLowerCase()}`},{type:'curl',label:'Add some bouncy curls'},{type:'short',label:'Snip a shorter hairstyle'},{type:'straight',label:'Straighten some hair'},{type:'wash',label:'Shampoo, then rinse the hair'}];const beauty=[{type:'nailColor',target:cc[1],label:`Paint 3 nails ${cc[0].toLowerCase()}`},{type:'makeup',target:'lipstick',label:'Paint on some lipstick'},{type:'makeup',target:'blush',label:'Add colour to both cheeks'},{type:'makeup',target:'eye',label:'Apply eye shadow'}];return[variants[Math.floor(Math.random()*variants.length)],beauty[Math.floor(Math.random()*beauty.length)],{type:'outfit',target:o.id,label:`Try the ${o.name.toLowerCase()}`}];}
function goalDone(g){if(g.type==='hairColor')return state.hair.filter(h=>h.color===g.target).length>=12;if(g.type==='curl')return state.hair.filter((h,i)=>h.curl>before.hair[i].curl+.12).length>=12;if(g.type==='straight')return state.hair.filter((h,i)=>h.curl<before.hair[i].curl-.045).length>=12;if(g.type==='short')return state.hair.filter((h,i)=>h.len<before.hair[i].len-35).length>=16;if(g.type==='wash')return state.hair.filter(h=>h.clean).length>=16;if(g.type==='outfit')return state.outfit===g.target;if(g.type==='makeup'){const strokes=state.makeup.filter(s=>s.tool===g.target);if(g.target==='lipstick')return strokes.some(s=>s.points.length>=2);return [-1,1].every(side=>strokes.some(s=>s.points.filter(p=>side<0?p.x<300:p.x>300).length>=2));}if(g.type==='nailColor')return new Set(state.nails.filter(s=>s.tool==='polish'&&s.color===g.target&&s.points.length>=3).map(s=>s.nail)).size>=3;return false;}

function point(e){const r=canvas.getBoundingClientRect();transform();return{x:(e.clientX-r.left-viewX)/viewScale,y:(e.clientY-r.top-viewY)/viewScale};}
function nearHair(p,r){const found=[];for(let i=0;i<64;i++){if(state.hair[i].len<=0&&tool!=='grow')continue;const pts=hairPoints(state.hair[i],i);let nearest=null,dist=r*r;for(let j=0;j<pts.length;j++){const pp=pts[j],d=(pp.x-p.x)**2+(pp.y-p.y)**2;if(d<dist){dist=d;nearest={i,t:pp.t,x:pp.x,y:pp.y};}}if(nearest)found.push(nearest);}return found;}

function applyTool(p,prev){let changed=false;if(stage==='hair'){const hit=nearHair(p,tool==='scissors'?Math.max(18,brushSize):brushSize+9);for(const q of hit){const h=state.hair[q.i];if(tool==='scissors'){const cut=h.len*q.t,newLen=cut<=10?0:cut;if(newLen<h.len-.25){h.len=newLen;if(!newLen){h.foam=0;h.fluff=0;}changed=true;}}
if(tool==='grow'&&h.len<370){h.len=Math.min(370,h.len+7);changed=true;}
if(tool==='colour'){const col=colour==='rainbow'?palette[Math.floor(q.i/7)%6][1]:colour;if(h.color!==col){h.color=col;changed=true;}}
if(tool==='curl'&&h.curl<1.35){h.curl=Math.min(1.35,h.curl+.09);changed=true;}
if(tool==='straight'&&h.curl>0){h.curl=Math.max(0,h.curl-.1);changed=true;}

if(tool==='rinse'&&h.foam>0){h.foam=Math.max(0,h.foam-.2);h.clean=true;h.wet=1;h.fluff=0;changed=true;}}
if(changed){const col=colour==='rainbow'?'#d983ad':colour;effect(p,tool==='wash'||tool==='rinse'?'bubble':tool==='scissors'?'snip':'spark',tool==='scissors'?people[state.person].hair:col);}}
else if(stage==='makeup'||stage==='nails'){const nail=stage==='nails'?nailAt(p):-1,valid=stage==='nails'?nail>=0:validFacePoint(p,tool);if(!valid){activeStroke=null;return false;}const list=stage==='nails'?state.nails:state.makeup;if(tool==='erase'){for(let i=list.length-1;i>=0;i--){const s=list[i];if(stage==='nails'&&s.nail!==nail)continue;const radius=brushSize+s.size/2;const next=s.points.filter(pp=>Math.hypot(pp.x-p.x,pp.y-p.y)>radius);if(next.length!==s.points.length){changed=true;s.points=next;}if(!s.points.length)list.splice(i,1);}activeStroke=null;}
else{const dist=activeStroke&&activeStroke.points.length?Math.hypot(p.x-activeStroke.points.at(-1).x,p.y-activeStroke.points.at(-1).y):Infinity;const spacing=['sparkle','dots','heart'].includes(tool)?(tool==='heart'?17:9):1.8;if(!activeStroke||activeStroke.nail!==nail){activeStroke={tool,color:colour==='rainbow'?palette[0][1]:colour,size:tool==='stripes'?5:stage==='nails'?brushSize*.6:brushSize,nail,points:[]};list.push(activeStroke);}if(dist>=spacing){activeStroke.points.push({x:p.x,y:p.y});changed=true;if(tool==='sparkle')effect(p,'spark',colour);}

}if(changed){strokeChanged=true;dirty=true;}return changed;}
function onPointerDown(e){if(!$('overlay').hidden||stage==='outfit'||pointer)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);pointer=point(e);pointer.id=e.pointerId;lastPoint={...pointer};checkpoint();strokeChanged=false;activeStroke=null;ctx.save();ctx.setTransform(1,0,0,1,0,0);applyTool(pointer,null);ctx.restore();dirty=true;}
function onPointerMove(e){if(!pointer||e.pointerId!==pointer.id)return;e.preventDefault();const p=point(e),old={...lastPoint},distance=Math.hypot(p.x-old.x,p.y-old.y);const steps=Math.min(120,Math.max(1,Math.ceil(distance/5)));ctx.save();ctx.setTransform(1,0,0,1,0,0);for(let n=1;n<=steps;n++){const pp={x:old.x+(p.x-old.x)*n/steps,y:old.y+(p.y-old.y)*n/steps};applyTool(pp,lastPoint);lastPoint=pp;}ctx.restore();pointer={...p,id:e.pointerId};dirty=true;}
function onPointerEnd(e){if(!pointer||e.pointerId!==pointer.id)return;if(strokeChanged){if(stage==='hair'&&!['colour','wash','rinse'].includes(tool)&&state.hairstyle){state.hairStyleEdited=true;const label=$('stylePickerButton')?.querySelector('small');if(label)label.textContent=(hairstyles.find(h=>h.id===state.hairstyle)?.name||'Hairstyle')+' · edited';}markEdit();}else{undo.pop();$('undoButton').disabled=!undo.length;}pointer=null;lastPoint=null;activeStroke=null;dirty=true;}

function showHome(){openModal(`<div class="welcome-art"><canvas id="welcomeCanvas" width="600" height="700"></canvas><div class="art-caption">Every great look starts with you.</div></div><div class="welcome-copy"><div class="eyebrow">Welcome to your very own salon</div><h1><span>Donna’s</span>Divine Cuts</h1><p>A snip, a splash of colour, a little sparkle.<br>What will you create today?</p><button class="mode-button primary" data-action="free">${icon('grow')}<span><b>Free Play</b><small>Your ideas. Every tool unlocked.</small></span></button><button class="mode-button soft" data-action="requests">${icon('star')}<span><b>Customer Requests</b><small>Make their day. Earn stars & lovely things.</small></span></button>${progress.active?'<button class="small" data-action="resume">Continue your makeover</button>':''}<div class="welcome-bottom">No timers. No ads. Just imagination.<br>Made for fingers, with room for happy accidents.</div></div>`,'welcome');const art=$('welcomeCanvas').getContext('2d'),s=baseState(0);s.hair.forEach((h,i)=>{h.color=i<32?'#805a54':'#c18c99';h.len=280+Math.sin(i)*8;h.curl=.6;});s.accessory='flower';s.earrings=true;s.outfit='mint';art.save();art.translate(-17,10);art.scale(1.04,1.04);drawPerson(art,s);art.restore();}
function customerPicker(chosenMode=mode){const oldMode=mode;openModal(closeButton()+`<div class="modal-heading"><div class="eyebrow">${chosenMode==='free'?'Free play':'Customer requests'}</div><h2>Who’s in the chair?</h2><p>Nine lovely customers, each with her own face and features. Who would you like to style?</p></div><div class="customer-grid">`+people.map((p,i)=>`<button class="customer-choice" data-person="${i}" data-mode="${chosenMode}"><canvas id="person${i}" width="230" height="200"></canvas><span>${p.name}<small>${p.age}</small></span></button>`).join('')+'</div><p class="keyboard-note">Your stars and saved album stay with you when you start a new customer.</p><div class="modal-actions"><button data-action="home">Change play mode</button></div>');people.forEach((p,i)=>{const c=$('person'+i).getContext('2d');c.save();c.scale(.52,.52);c.translate(-80,-90);drawPerson(c,baseState(i));c.restore();});}
function startCustomer(i,m){hasSession=true;mode=m;state=baseState(i);before=clone(state);goals=mode==='requests'?makeGoals():[];if(goals.some(g=>g.type==='outfit'&&g.target===state.outfit)){state.outfit='sky';before.outfit='sky';}undo=[];effects=[];finishData=null;colour=palette[0][1];beforeImage=photoData(before);chooseStage('hair');updateCustomer();updateProgress();closeModal();persist();$('undoButton').disabled=true;notify(mode==='free'?'Welcome! Pick a tool and try it on her hair.':'Her three wishes are beside the mirror. Take your time!');}
function resume(){const a=progress.active;if(a&&a.state&&Array.isArray(a.state.hair)&&a.state.hair.length===64&&people[a.state.person]){hasSession=true;finishData=null;state=clone(a.state);before=clone(a.before||baseState(state.person));mode=a.mode==='requests'?'requests':'free';goals=Array.isArray(a.goals)?clone(a.goals):[];goals.forEach(g=>{if(g.type==='makeup'&&g.target==='eye')g.label='Apply eye shadow';});undo=[];beforeImage=photoData(before);chooseStage(['hair','makeup','nails','outfit'].includes(a.stage)?a.stage:'hair');updateCustomer();updateProgress();$('undoButton').disabled=true;closeModal();}else{customerPicker('free');}}
function rewardsModal(){openModal(closeButton()+`<div class="modal-heading"><div class="eyebrow">Your lovely collection</div><h2>${progress.stars} stars & counting</h2><p>Earn up to 3 stars for customer requests, or 1 for a Free Play makeover. Stars add up — they aren’t spent.</p></div><div class="reward-list">`+rewards.map(r=>`<div class="reward">${icon(r.icon)}<div><b>${r.name}</b><small>${progress.stars>=r.at?'Unlocked — yours to keep!':r.at+' stars · '+(r.at-progress.stars)+' more to go'}</small></div><div class="spacer"></div><b>${progress.stars>=r.at?'✓':r.at+' ★'}</b></div>`).join('')+'</div><p class="keyboard-note">All items can be explored right away in Free Play.</p>');}
function help(){openModal(closeButton()+`<div class="modal-heading"><div class="eyebrow">A little helping hand</div><h2>Welcome, stylist!</h2><p>Tap a station along the bottom, choose a tool, then use your finger.</p></div><div class="help-grid"><div class="help-box"><b>Hair magic</b>Tap Hairstyles to choose one of twelve looks, then customise it. Drag across hair to cut it. Paint to colour individual locks. Grow-back works even on very short hair: brush over the top of her head. Shampoo first, rinse the bubbles away, then use the dryer. Rinsed hair stays visibly dark, shiny and wet until it is dried. Drying fluffs the hair up; brush it to smooth it again. You can cut right down to a bare scalp and grow it back.</div><div class="help-box"><b>Makeup & nails</b>Paint directly on lips, eyelids, cheeks and nails. In Nails, choose a length and shape first — including long false nails. In Outfits, mix the main and detail colours. The colour stays inside the area. Use Remove to rub paint away. A fine tool helps with tiny details.</div><div class="help-box"><b>Stars, without a timer</b>Each completed wish earns a star. Colour about a quarter of the hair, or paint three nails for colour requests. You can keep styling until you’re happy.</div><div class="help-box"><b>Keep the memories</b>Reveal the look for a before-and-after. Save favourites to the album and download a picture. Hold Before to peek at the original. Undo fixes the last action.</div></div><p class="keyboard-note">Progress and up to 18 saved looks are stored in this browser when available. Use the same file and browser to return. Download favourite photos to keep a separate copy. Full screen depends on your browser.</p>`);}
function finish(){if(state.edits<1)return notify('Try a tool or choose a new outfit before the big reveal!');const done=goals.filter(goalDone).length;if(mode==='requests'&&done<3){openModal(closeButton()+`<div class="modal-heading"><div class="eyebrow">Looking lovely already</div><h2>A few finishing touches?</h2><p>You’ve completed ${done} of her 3 wishes. You can keep styling or reveal the look now.</p></div><div class="goals">`+goals.map(g=>`<div class="goal ${goalDone(g)?'done':''}"><span class="check">✓</span><span>${g.label}</span></div>`).join('')+`</div><div class="modal-actions"><button class="primary" data-action="close">Keep styling</button><button data-action="reveal">Reveal · ${done} ${done===1?'star':'stars'}</button></div>`);return;}reveal();}
function reveal(){if(!finishData){const earned=mode==='free'?1:goals.filter(goalDone).length,oldStars=progress.stars;progress.stars+=earned;progress.visits++;finishData={earned,after:clone(state),before:clone(before),saved:false,unlocks:rewards.filter(r=>r.at>oldStars&&r.at<=progress.stars)};progress.active=null;clearTimeout(saveTimer);try{localStorage.setItem('donnas-divine-cuts-v1',JSON.stringify(progress));}catch(e){storageOK=false;}updateProgress();}const f=finishData;openModal(`<div class="modal-heading" style="text-align:center;padding:0"><div class="eyebrow">The big reveal · ${people[state.person].name}</div><h2>Made with imagination</h2><div class="result-stars">${'★'.repeat(f.earned)}${'☆'.repeat(Math.max(0,3-f.earned))}</div><p class="result-note">${f.earned===3?'Every wish came true. What a lovely makeover!':mode==='free'?'One star for a look that’s all your own.':f.earned?'A lovely new look! '+f.earned+' '+(f.earned===1?'wish completed.':'wishes completed.'):'A creative new look! Try her wishes next time to earn stars.'}${f.unlocks.length?'<br><b>New: '+f.unlocks.map(r=>r.name).join(' & ')+'!</b>':''}</p></div><div class="before-after"><figure class="photo"><img src="${photoData(f.before)}" alt="Before the makeover"><figcaption>Before</figcaption></figure><figure class="photo"><img src="${photoData(f.after)}" alt="After the makeover"><figcaption>After</figcaption></figure></div><div class="modal-actions"><button class="soft" data-action="save-look">${icon('album')} ${f.saved?'Saved to album':'Save to album'}</button><button data-action="download-look">${icon('camera')} Download photo</button><button class="primary" data-action="next">Next customer</button></div><div class="modal-actions" style="margin-top:10px"><button class="small" data-action="album">Lookbook</button><button class="small" data-action="home">Salon menu</button></div>`);}
function saveLook(){if(!finishData||finishData.saved)return notify('This look is already in your album.');if(progress.album.length>=18){notify('Your album has 18 looks. Remove one from the album to make room.');return;}progress.album.unshift({id:Date.now(),before:clone(finishData.before),after:clone(finishData.after),name:people[state.person].name,date:new Date().toLocaleDateString(),stars:finishData.earned});finishData.saved=true;try{localStorage.setItem('donnas-divine-cuts-v1',JSON.stringify(progress));notify('Saved to your photo album!');}catch(e){storageOK=false;notify('Saved for this visit. Download the photo to keep a copy.');}reveal();}
function downloadPhoto(b,a,name){const out=document.createElement('canvas');out.width=1000;out.height=730;const c=out.getContext('2d');c.fillStyle='#fffaf6';c.fillRect(0,0,1000,730);c.fillStyle='#685575';c.textAlign='center';c.font='36px Georgia';c.fillText('Donna’s Divine Cuts',500,52);c.font='16px sans-serif';c.fillText(name+' · A little colour. A little magic.',500,83);const images=[new Image(),new Image()];let ready=0;images.forEach((im,i)=>{im.onload=()=>{c.drawImage(im,35+i*480,112,450,510);if(++ready===2){c.font='15px sans-serif';c.fillStyle='#685575';c.fillText('BEFORE',260,651);c.fillText('AFTER',740,651);c.font='italic 18px Georgia';c.fillText('Styled with imagination',500,700);const link=document.createElement('a');link.href=out.toDataURL('image/png');link.download='donnas-divine-cuts-'+name.toLowerCase()+'.png';document.body.appendChild(link);link.click();link.remove();}};im.src=photoData(i?a:b);});}
function album(){openModal(closeButton()+`<div class="modal-heading"><div class="eyebrow">Made by you</div><h2>Your lookbook</h2><p>${progress.album.length} of 18 looks saved. Tap a photo for the before-and-after.</p></div>`+(progress.album.length?'<div class="album-grid">'+progress.album.map((a,i)=>`<article class="album-item"><button style="padding:0;min-height:0;border:0" data-album="${i}" aria-label="View ${a.name} makeover"><img src="${photoData(a.after)}" alt="${a.name}’s saved makeover"></button><p><b>${a.name}</b> · ${'★'.repeat(a.stars)}<br>${a.date}</p><button data-remove="${i}">Remove from album</button></article>`).join('')+'</div>':'<div class="empty">'+icon('album')+'<p>Your first masterpiece belongs here.<br>Finish a makeover, then choose “Save to album”.</p></div>'));}
function albumDetail(i){const a=progress.album[i];if(!a)return;openModal(closeButton()+`<div class="modal-heading"><div class="eyebrow">Your lookbook</div><h2>${a.name}’s makeover</h2></div><div class="before-after"><figure class="photo"><img src="${photoData(a.before)}" alt="Before"><figcaption>Before</figcaption></figure><figure class="photo"><img src="${photoData(a.after)}" alt="After"><figcaption>After</figcaption></figure></div><div class="modal-actions"><button data-action="album">Back to album</button><button class="primary" data-download="${i}">${icon('camera')} Download photo</button></div>`);}
$('overlay').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.jewelGroup){chooseJewellery(b.dataset.jewelGroup,b.dataset.jewel);return;}if(b.dataset.lengthPicker){setNailOption('nailLength',b.dataset.lengthPicker);nailPicker();return;}if(b.dataset.formPicker){setNailOption('nailForm',b.dataset.formPicker);nailPicker();return;}if(b.dataset.wardrobe){setOutfit(b.dataset.wardrobe);return;}if(b.dataset.hairstyle){applyHairstyle(b.dataset.hairstyle);return;}if(b.dataset.person!==undefined){startCustomer(+b.dataset.person,b.dataset.mode);return;}if(b.dataset.album!==undefined){albumDetail(+b.dataset.album);return;}if(b.dataset.download!==undefined){const a=progress.album[+b.dataset.download];downloadPhoto(a.before,a.after,a.name);return;}if(b.dataset.remove!==undefined){const i=+b.dataset.remove;openModal(closeButton()+`<div class="modal-heading"><h2>Remove this look?</h2><p>This will remove ${progress.album[i].name}’s saved makeover from your album.</p></div><div class="modal-actions"><button class="primary" data-action="album">Keep it</button data-confirm-remove="${i}">Remove look</button></div>`);return;}if(b.dataset.confirmRemove!==undefined){progress.album.splice(+b.dataset.confirmRemove,1);try{localStorage.setItem('donnas-divine-cuts-v1',JSON.stringify(progress));}catch(e){}album();return;}switch(b.dataset.action){case'close':closeModal();break;case'home':showHome();break;case'free':customerPicker('free');break;case'requests':customerPicker('requests');break;case'resume':resume();break;case'reveal':reveal();break;case'save-look':saveLook();break;case'download-look':downloadPhoto(finishData.before,finishData.after,people[state.person].name);break;case'next':customerPicker(mode);break;case'album':album();break;}});
$('finishButton').addEventListener('click',finish);$('undoButton').addEventListener('click',doUndo);$('customerButton').addEventListener('click',()=>customerPicker());$('homeButton').addEventListener('click',showHome);$('helpButton').addEventListener('click',help);$('albumButton').addEventListener('click',album);$('rewardsButton').addEventListener('click',rewardsModal);$('viewRewards').addEventListener('click',rewardsModal);
document.addEventListener('fullscreenchange',()=>{const active=!!document.fullscreenElement,b=$('fullscreenButton');b.setAttribute('aria-pressed',String(active));b.setAttribute('aria-label',active?'Exit full screen':'Full screen');b.title=active?'Exit full screen':'Full screen';resize();});
document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>chooseStage(b.dataset.stage)));
$('compareButton').addEventListener('pointerdown',e=>{showBefore=true;dirty=true;e.currentTarget.setPointerCapture(e.pointerId);});['pointerup','pointercancel','lostpointercapture','blur'].forEach(t=>$('compareButton').addEventListener(t,()=>{showBefore=false;dirty=true;}));$('compareButton').addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();showBefore=true;dirty=true;}});$('compareButton').addEventListener('keyup',()=>{showBefore=false;dirty=true;});
$('fullscreenButton').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else notify('Try your browser’s full-screen or Add to Home Screen option.');}catch(e){notify('Full screen isn’t available in this viewer. Open the HTML in your browser.');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden&&!$('modal').classList.contains('welcome'))closeModal();if((e.ctrlKey||e.metaKey)&&e.key==='z'&&$('overlay').hidden){e.preventDefault();doUndo();}if(e.key==='Tab'&&!$('overlay').hidden){const els=[...$('modal').querySelectorAll('button:not(:disabled),input')];if(!els.length)return;const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('resize',resize);window.addEventListener('pagehide',()=>{if(!finishData)persist();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&!finishData)persist();});
if(progress.active){migrateNailGeometry(progress.active.state);migrateNailGeometry(progress.active.before);}for(const look of progress.album){migrateNailGeometry(look.before);migrateNailGeometry(look.after);}
updateCustomer();updateProgress();renderPanel();$('undoButton').disabled=true;resize();requestAnimationFrame(frame);showHome();
// Pure, local hooks used for deterministic game-logic checks; no network or external dependencies.
window.SalonGame={get state(){return state},get before(){return before},get progress(){return progress},get goals(){return goals},get stage(){return stage},get tool(){return tool},people,outfits,accessories,jewellery,rewards,chooseJewellery,jewelleryPicker,drawHair,faceConfig,faceRegion,mouthPath,getNails,nailPath,nailLocal,nailWorld,migrateNailGeometry,nailLengths,nailForms,nailPicker,setNailOption,setOutfit,setFabric,outfitThumbnail,wardrobePicker,canvasPoint(p){transform();return{x:p.x*viewScale+viewX,y:p.y*viewScale+viewY}},hairstyles,styledState,styleThumbnail,stylePicker,applyHairstyle,startCustomer,chooseStage,goalDone,makeGoals,baseState,hairPoints,applyTool,validFacePoint,nailAt,drawPerson,drawNails,photoData,doUndo,checkpoint,finish,reveal,saveLook,resume,unlocked,setTool(t){tool=t;activeStroke=null;},setColour(c){colour=c;},get finishData(){return finishData}};
})();
