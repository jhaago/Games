<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Games</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#fff}
    body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
    main{width:min(900px,100%)}
    h1{font-size:clamp(2.6rem,8vw,5rem);margin:0 0 .35rem;letter-spacing:-.04em}
    p{color:#b9c3d8;font-size:1.05rem;margin:.25rem 0 1.5rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
    .card{display:block;text-decoration:none;color:#fff;background:#151d30;border:1px solid #26324d;border-radius:22px;padding:22px;min-height:150px;transition:transform .15s ease,border-color .15s ease}
    .card:hover,.card:focus-visible{transform:translateY(-2px);border-color:#7aa2ff;outline:none}
    .icon{font-size:2.2rem;margin-bottom:16px}
    .title{font-size:1.3rem;font-weight:800}
    .sub{color:#9aa8c2;margin-top:6px;font-size:.95rem;line-height:1.4}
    .empty{border-style:dashed;opacity:.8;cursor:default}
    footer{margin-top:22px;color:#6f7d99;font-size:.85rem}
  </style>
</head>
<body>
  <main>
    <h1>Games</h1>
    <p>A home for our standalone browser games.</p>
    <section class="grid" aria-label="Game library">
      <a class="card" href="./soccer/">
        <div class="icon">⚽</div>
        <div class="title">Soccer Showdown</div>
        <div class="sub">Arcade football with custom teams, difficulty levels and touch controls.</div>
      </a>
    <a class="card" href="./donnas-divine-cuts/">
        <div class="icon">💇‍♀️</div>
        <div class="title">Donna’s Divine Cuts</div>
        <div class="sub">A touch-friendly makeover salon with hair, makeup, outfits and nails.</div>
      </a>
    </section>
    <footer>Built to work on phones, tablets and computers.</footer>
  </main>
</body>
</html>
