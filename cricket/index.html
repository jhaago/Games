function help(inMatch=false){showModal('THE QUICK GUIDE','Make every ball count',`<div class="helpText"><p><b>BATTING</b> · On the first three difficulty levels you can choose a shot early and the batter will make perfectly timed contact for you. You can still wait and tap as the ball reaches the batter. The moving marker should meet the centre line. One shot per delivery.</p><p><b>Defend</b> straight balls. <b>Drive</b> full balls. <b>Cut</b> short balls to your right (off side). <b>Pull</b> short balls to your left. <b>Loft</b> risks a catch for a big hit.</p><p><b>ADVANCED SHOTS</b> · From <b>ARCADE</b> difficulty upward a second row unlocks: <b>Sweep</b> and <b>Reverse</b> are strongest against spin, <b>Hook</b> attacks short high balls, <b>Glance</b> works leg-side balls, and <b>Scoop</b> is a high-risk shot over the keeper.</p><p><b>RUN</b> after contact. Tap again to queue one more, or <b>TURN BACK</b> to retreat. Beat the throw to avoid a run-out. Boundaries score four; over the rope without a bounce scores six.</p><p><b>BOWLING</b> · Select a type, tap/drag on the pitch, then <b>START RUN-UP</b>. Tap <b>RELEASE</b> as the marker crosses the broad green middle. If you do nothing, the bowler now releases automatically with safe accuracy.</p><p>Each innings is ${cfg.overs} over${cfg.overs===1?'':'s'} or 10 wickets. Wides add a run and are bowled again.</p><p style="font-size:10px">Keyboard: 1–5 standard shots · 6 Sweep · 7 Reverse · 8 Hook · 9 Glance · 0 Scoop · R run · T turn back · Space bowl/release · P pause.</p></div>`,[{label:inMatch?'BACK TO MATCH':'LET’S PLAY',primary:true,action:()=>{hideModal();if(inMatch){G.paused=false;syncUI()}}}])}
function syncUI(){if(G.state==='setup')return;const t=G.innings;$('teamName').textContent=team(t).label.toUpperCase();$('inningsLabel').textContent=batting()?'YOU ARE BATTING':'YOU ARE BOWLING';$('score').textContent=G.score[t]+' / '+G.wickets[t];$('overCount').textContent=oversText(G.balls[t]);$('overLimit').textContent='OF '+cfg.overs+' OVER'+(cfg.overs===1?'':'S');$('chase').textContent=t===1?'TARGET '+G.target+' • NEED '+Math.max(0,G.target-G.score[1])+' FROM '+Math.max(0,cfg.overs*6-G.balls[1]):team(0).short+' v '+team(1).short+' • '+LEVELS[cfg.level];
$('batControls').classList.toggle('hidden',!batting());$('bowlControls').classList.toggle('hidden',batting());const advancedShots=cfg.level>=3;$('shots').classList.toggle('advanced-mode',advancedShots);document.querySelectorAll('.advancedShot').forEach(b=>b.classList.toggle('hidden',!advancedShots));const canShot=!G.paused&&!G.delivery?.shotTaken&&(G.state==='flight'||(difficulty().shotQueue&&G.state==='runup'));document.querySelectorAll('[data-shot]').forEach(b=>b.disabled=!canShot);const canRun=['live','gather','throw'].includes(G.state)&&!G.paused;document.querySelectorAll('[data-shot]').forEach(b=>b.classList.toggle('active',G.delivery?.queuedShot===b.dataset.shot));$('run').disabled=!canRun||G.completed>=3;$('back').disabled=!canRun||!G.running;$('run').textContent=G.running?(G.queued?'CANCEL NEXT RUN':'RUN AGAIN +'):'RUN ▸';$('back').textContent=G.returning?'KEEP GOING':'TURN BACK';$('bowl').disabled=G.paused||!(['ready','runup'].includes(G.state))||(G.state==='runup'&&G.meterLocked);$('bowl').textContent=G.state==='ready'?'START RUN-UP':G.state==='runup'?(G.meterLocked?'LOCKED IN':'RELEASE!'):'BALL IN PLAY';document.querySelectorAll('[data-type]').forEach(b=>{b.disabled=G.state!=='ready'||G.paused;b.classList.toggle('active',b.dataset.type===input.type)});$('bowlTip').textContent=G.state==='ready'?'Tap or drag on the pitch to aim.':G.state==='runup'?'Tap RELEASE near the middle — or let it auto-release.':'Watch your delivery and the fielders.';
let status='';if(G.state==='ready')status=batting()?'Watch the ball. Tap a shot at the crease.':'Choose your line and length.';else if(G.state==='runup')status=batting()?(G.delivery.queuedShot?G.delivery.queuedShot.toUpperCase()+' READY • AUTO-TIMING ON':({fast:'FAST BOWLER',medium:'MEDIUM PACE',off:'OFF SPIN',leg:'LEG SPIN'}[G.delivery.type])+' • GET READY'):'TIME YOUR RELEASE';else if(G.state==='flight'){const d=G.delivery;status=batting()?(d.bounced?'BALL BOUNCED • PLAY YOUR SHOT':'WATCH THE BALL'):({fast:'FAST',medium:'MEDIUM',off:'OFF SPIN',leg:'LEG SPIN'}[d.type])+' • '+(d.bounced?'AFTER THE BOUNCE':'IN FLIGHT')}else if(canRun)status=G.state==='throw'?'THROW COMING! '+G.ballRuns+' completed':G.running?(G.returning?'TURNING BACK':'RUNNING')+' • '+G.ballRuns+' completed':(batting()?'BALL IN PLAY • RUN?':'FIELDERS CHASING')+' • '+G.ballRuns+' completed';else if(G.state==='result')status=G.outcome?.wide?'WIDE • BOWL AGAIN':G.outcome?.wicket?'NEW BATTER COMING IN':'NEXT BALL';$('status').textContent=status;
const hist=G.history[t]||[],lastOver=hist.length?hist[hist.length-1].over:0;const list=hist.filter(e=>e.over===lastOver).map(e=>e.token);$('overDots').replaceChildren();for(const token of list.slice(-8)){const el=document.createElement('span');el.className='dot'+(token==='W'?' out':token===4||token===6?' bound':'');el.textContent=token;$('overDots').appendChild(el)}
}
function updateMeters(){let t=.04;if(G.state==='flight'){const d=G.delivery;t=clamp(.5+(d.clock-d.duration)/(difficulty().window*5),0,1)}else if(G.state==='live'||G.state==='result')t=.5;$('timingMarker').style.left=(t*100)+'%';$('timingMarker').style.opacity=G.state==='flight'?'1':'.25';$('bowlMarker').style.left=((G.state==='runup'?G.meter:.03)*100)+'%';$('bowlMarker').style.background=G.meterLocked?'#ffdf71':'#ffffff';}
function updateSetup(){for(const id of ['team0','team1']){$(id).innerHTML=Object.entries(TEAMS).map(([key,t])=>`<option value="${key}">${t.label}</option>`).join('');$(id).value=cfg[id]}$('difficulty').innerHTML=LEVELS.map((d,i)=>`<option value="${i}">${d}</option>`).join('');$('difficulty').value=cfg.level;$('ground').value=cfg.ground;document.querySelectorAll('[data-overs]').forEach(b=>b.classList.toggle('active',+b.dataset.overs===cfg.overs));$('sound').style.opacity=cfg.sound?'1':'.5';$('sound').setAttribute('aria-pressed',String(cfg.sound))}
function unlockSound(){try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}if(audioCtx?.state==='suspended')audioCtx.resume().catch(()=>{})}catch(e){}}
function sound(kind){if(!cfg.sound||!audioCtx||audioCtx.state!=='running')return;try{const times={six:[523,659,784,1047],four:[523,659,784],wicket:[160,115,82],run:[600,800],hit:[220],bounce:[120],swish:[350],release:[250],throw:[400],drop:[200,150],tap:[700]}[kind]||[500];times.forEach((freq,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+i*.085;o.type=kind==='hit'||kind==='wicket'?'triangle':'sine';o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*.75,t+.10);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(kind==='hit'?.12:.045,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.18)})}catch(e){}}
$('overs').onclick=e=>{const b=e.target.closest('[data-overs]');if(b){cfg.overs=+b.dataset.overs;save();updateSetup()}};$('difficulty').onchange=e=>{cfg.level=+e.target.value;save()};$('ground').onchange=e=>{cfg.ground=e.target.value;save();backgroundDirty=true};for(const id of ['team0','team1'])$(id).onchange=e=>{cfg[id]=e.target.value;const other=id==='team0'?'team1':'team0';if(cfg[other]===cfg[id])cfg[other]=Object.keys(TEAMS).find(k=>k!==cfg[id]);save();updateSetup();drawHero()};
$('play').onclick=()=>{unlockSound();begin()};$('help').onclick=()=>help(false);$('pause').onclick=pause;$('sound').onclick=()=>{cfg.sound=!cfg.sound;save();unlockSound();updateSetup();sound('tap')};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen();return}const request=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;if(request)await request.call(document.documentElement);else notice('For a full-screen view, open from your Home Screen.',2.5)}catch(e){notice('Fullscreen is unavailable in this browser view.',2)}resize()};
function bindPress(id,fn){$(id).addEventListener('pointerdown',e=>{if(e.button>0||e.currentTarget.disabled)return;e.preventDefault();unlockSound();fn()});$(id).addEventListener('click',e=>{if(e.detail===0&&!e.currentTarget.disabled)fn()})}
$('shots').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-shot]');if(!b||b.disabled||e.button>0)return;e.preventDefault();unlockSound();swing(b.dataset.shot);syncUI()});$('shots').addEventListener('click',e=>{const b=e.target.closest('[data-shot]');if(e.detail===0&&b&&!b.disabled){swing(b.dataset.shot);syncUI()}});bindPress('run',runAction);bindPress('back',turnBack);bindPress('bowl',bowlAction);$('types').onclick=e=>{const b=e.target.closest('[data-type]');if(b&&!b.disabled){input.type=b.dataset.type;syncUI();sound('tap')}};
function aim(e){if(batting()||G.state!=='ready'||G.paused)return;const rect=canvas.getBoundingClientRect(),p=unproject(e.clientX-rect.left,e.clientY-rect.top);input.target.x=clamp(p.x,pitchX(-7.6),pitchX(7.6));input.target.y=clamp(p.y,pitchY(-3),pitchY(24))}
canvas.addEventListener('pointerdown',e=>{if(G.state!=='ready'||batting()||G.paused)return;e.preventDefault();input.pointer=e.pointerId;canvas.setPointerCapture(e.pointerId);aim(e)});canvas.addEventListener('pointermove',e=>{if(e.pointerId===input.pointer)aim(e)});for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>{input.pointer=null});
document.addEventListener('keydown',e=>{if(G.state==='setup'||e.repeat)return;const k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(k==='p'||k==='escape'){pause();return}if(G.paused||!$('modal').classList.contains('hidden'))return;unlockSound();if(batting()){if('12345'.includes(k)&&k.length===1)swing(['defend','drive','cut','pull','loft'][+k-1]);if(cfg.level>=3&&'67890'.includes(k))swing(({6:'sweep',7:'reverse',8:'hook',9:'glance',0:'scoop'})[k]);if(k==='r')runAction();if(k==='t')turnBack()}else{if(k===' '||k==='enter')bowlAction();if(G.state==='ready'){if(k==='arrowleft')input.target.x=clamp(input.target.x-.5,pitchX(-7.6),pitchX(7.6));if(k==='arrowright')input.target.x=clamp(input.target.x+.5,pitchX(-7.6),pitchX(7.6));if(k==='arrowup')input.target.y=clamp(input.target.y+(batting()? -1:1),pitchY(-3),pitchY(24));if(k==='arrowdown')input.target.y=clamp(input.target.y+(batting()? 1:-1),pitchY(-3),pitchY(24))}}syncUI()});
